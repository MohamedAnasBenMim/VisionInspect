[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visioninspect"
version = "1.0.0"
description = "Industrial defect detection, segmentation, evaluation, and optimized inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "fastapi>=0.115",
  "python-multipart>=0.0.12",
  "pydantic>=2.9"
]

[project.optional-dependencies]
vision = [
  "torch>=2.2",
  "opencv-python-headless>=4.10",
  "onnx>=1.17",
  "onnxscript>=0.1",
  "onnxruntime>=1.20"
]
server = ["uvicorn>=0.32"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "httpx>=0.27"]

[project.scripts]
visioninspect-train = "visioninspect.training:main"
visioninspect-benchmark = "visioninspect.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=visioninspect --cov-report=term-missing --cov-fail-under=82"

[tool.coverage.run]
omit = ["src/visioninspect/api.py", "src/visioninspect/benchmark.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
