<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionInspect Dashboard</title>
<style>body{background:#0b1118;color:#e7edf5;font:16px system-ui;margin:0}.shell{max-width:900px;margin:70px auto;padding:30px}.panel{background:#121c27;border:1px solid #263a4d;border-radius:18px;padding:34px}h1{font-size:42px;margin:0 0 10px}.eyebrow{color:#38bdf8;font-size:12px;font-weight:700;letter-spacing:2px}.drop{border:1px dashed #4c6b84;border-radius:12px;margin:30px 0;padding:32px}button{background:#38bdf8;border:0;border-radius:8px;color:#07121b;font-weight:700;padding:12px 18px}pre{background:#091019;border-radius:10px;min-height:80px;padding:20px;white-space:pre-wrap}</style></head>
<body><main class="shell"><section class="panel"><div class="eyebrow">INDUSTRIAL QUALITY CONTROL</div><h1>VisionInspect</h1><p>Upload a surface image to run compact pixel-level defect segmentation.</p><form id="form" class="drop"><input id="file" type="file" accept="image/png,image/jpeg" required> <button>Inspect image</button></form><pre id="result">Awaiting inspection…</pre></section></main><script>document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();const data=new FormData();data.append('file',document.querySelector('#file').files[0]);const response=await fetch('/inspect',{method:'POST',body:data});document.querySelector('#result').textContent=JSON.stringify(await response.json(),null,2)});</script></body></html>
